name: Docker Package

on:
  push:
    branches: [iAdrian]
  workflow_dispatch:

concurrency:
  group: docker-package-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build-push-and-prune:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      REGISTRY: git.ciolan.net
      # Docker distribution names must be lowercase even though the Gitea user is iAdrian.
      IMAGE_OWNER: iadrian
      IMAGE_NAME: hermes-agent
      PACKAGE_TYPE: container
      KEEP_VERSIONS: "5"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to Gitea registry
        env:
          SECRET_REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          SECRET_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          SECRET_CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          registry_user="${SECRET_REGISTRY_USER:-${IMAGE_OWNER}}"
          registry_token="${SECRET_REGISTRY_TOKEN:-${SECRET_CI_TOKEN:-}}"
          if [ -z "$registry_token" ]; then
            echo "ERROR: missing REGISTRY_TOKEN or CI_TOKEN secret for registry login" >&2
            exit 1
          fi
          echo "$registry_token" \
            | docker login "${REGISTRY}" \
                -u "$registry_user" --password-stdin

      - name: Build and push image
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          sha_tag="${{ gitea.sha }}"
          short_sha="$(printf '%s' "$sha_tag" | cut -c1-12)"

          docker build \
            -t "${image}:${sha_tag}" \
            -t "${image}:${short_sha}" \
            -t "${image}:latest" \
            .

          docker_push_with_heartbeat() {
            local image="$1"
            local log=/tmp/docker-push.log
            rm -f "$log"
            docker push --all-tags "$image" >"$log" 2>&1 &
            local pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              echo "[push heartbeat] docker push still running for ${image} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              tail -20 "$log" || true
              sleep 60
            done
            wait "$pid"
            local rc=$?
            cat "$log" || true
            return "$rc"
          }

          docker_push_with_heartbeat "${image}"
          echo "[OK] pushed ${image}:${sha_tag}, ${image}:${short_sha}, ${image}:latest"

      - name: Link Docker package to repository
        env:
          SECRET_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          SECRET_CI_TOKEN: ${{ secrets.CI_TOKEN }}
          GITEA_API_URL: ${{ github.server_url }}/api/v1
        run: |
          set -euo pipefail
          gitea_token="${SECRET_REGISTRY_TOKEN:-${SECRET_CI_TOKEN:-}}"
          if [ -z "$gitea_token" ]; then
            echo "ERROR: missing REGISTRY_TOKEN or CI_TOKEN secret for package API" >&2
            exit 1
          fi
          http=$(curl -sS -o /tmp/package-link.out -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${gitea_token}" \
            "${GITEA_API_URL}/packages/${IMAGE_OWNER}/${PACKAGE_TYPE}/${IMAGE_NAME}/-/link/${IMAGE_NAME}")
          case "$http" in
            200|201|202|204|409)
              echo "Package link accepted/already present (HTTP $http)."
              ;;
            403)
              echo "WARNING: package link is not permitted by this Gitea API/token (HTTP 403); package push succeeded, continuing."
              cat /tmp/package-link.out >&2 || true
              ;;
            *)
              echo "ERROR: package link failed with HTTP $http" >&2
              cat /tmp/package-link.out >&2 || true
              exit 1
              ;;
          esac

      - name: Prune old Docker package versions
        env:
          SECRET_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          SECRET_CI_TOKEN: ${{ secrets.CI_TOKEN }}
          GITEA_API_URL: ${{ github.server_url }}/api/v1
          CURRENT_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          export GITEA_TOKEN="${SECRET_REGISTRY_TOKEN:-${SECRET_CI_TOKEN:-}}"
          if [ -z "$GITEA_TOKEN" ]; then
            echo "ERROR: missing REGISTRY_TOKEN or CI_TOKEN secret for package API" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          api = os.environ["GITEA_API_URL"].rstrip("/")
          token = os.environ["GITEA_TOKEN"]
          owner = os.environ["IMAGE_OWNER"]
          package_type = os.environ["PACKAGE_TYPE"]
          name = os.environ["IMAGE_NAME"]
          keep = int(os.environ.get("KEEP_VERSIONS", "5"))
          current_sha = os.environ.get("CURRENT_SHA", "")
          current_short = current_sha[:12] if current_sha else ""

          def request(method, url):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": f"token {token}",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      return resp.status, body
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  return exc.code, body

          versions = []
          page = 1
          while True:
              url = f"{api}/packages/{urllib.parse.quote(owner)}/{urllib.parse.quote(package_type)}/{urllib.parse.quote(name)}?page={page}&limit=50"
              status, body = request("GET", url)
              if status == 404:
                  print(f"No package found yet for {owner}/{package_type}/{name}; nothing to prune.")
                  sys.exit(0)
              if status < 200 or status >= 300:
                  print(f"ERROR: list package versions failed HTTP {status}: {body}", file=sys.stderr)
                  sys.exit(1)
              batch = json.loads(body or "[]")
              if isinstance(batch, dict):
                  if batch.get("message"):
                      print(f"No package versions returned yet: {batch.get('message')}")
                      sys.exit(0)
                  batch = batch.get("versions") or batch.get("data") or []
              if not batch:
                  break
              versions.extend(batch)
              if len(batch) < 50:
                  break
              page += 1

          def created(v):
              raw = v.get("created_at") or "0001-01-01T00:00:00Z"
              raw = raw.replace("Z", "+00:00")
              try:
                  return datetime.fromisoformat(raw)
              except ValueError:
                  return datetime.min.replace(tzinfo=timezone.utc)

          versions.sort(key=created, reverse=True)
          protected = {"latest"}
          if current_sha:
              protected.add(current_sha)
          if current_short:
              protected.add(current_short)

          keep_ids = set()
          for v in versions:
              if str(v.get("version")) in protected:
                  keep_ids.add(v.get("id"))
          for v in versions:
              if len(keep_ids) >= keep:
                  break
              keep_ids.add(v.get("id"))

          to_delete = [v for v in versions if v.get("id") not in keep_ids]
          print(f"Package versions found: {len(versions)}; keeping: {len(keep_ids)}; deleting: {len(to_delete)}")
          print("Keeping versions:")
          for v in versions:
              if v.get("id") in keep_ids:
                  print(f"  - {v.get('version')} ({v.get('created_at')})")

          for v in to_delete:
              version = str(v.get("version"))
              delete_url = f"{api}/packages/{urllib.parse.quote(owner)}/{urllib.parse.quote(package_type)}/{urllib.parse.quote(name)}/{urllib.parse.quote(version, safe='')}"
              status, body = request("DELETE", delete_url)
              if status in (200, 202, 204):
                  print(f"Deleted old package version: {version}")
              else:
                  print(f"ERROR: delete {version} failed HTTP {status}: {body}", file=sys.stderr)
                  sys.exit(1)
          PY
