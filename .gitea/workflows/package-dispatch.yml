name: Trigger Arch Package Build

on:
  push:
    branches: [iAdrian]
  workflow_dispatch:

concurrency:
  group: package-dispatch-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  trigger-package:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout ci-templates
        uses: actions/checkout@v4
        with:
          repository: archRepo/ci-templates
          path: .ci-templates
          ref: main

      - name: Dispatch archRepo/hermes-agent build
        uses: ./.ci-templates/trigger-arch-package
        with:
          package_repository: archRepo/hermes-agent
          workflow_file: build.yml
          ref: main
          triggered_by: ${{ github.repository }}@${{ github.sha }}
          key_rotation: 'false'
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
